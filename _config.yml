# GitHub Pages Configuration
# This file configures the Jekyll site for GitHub Pages

# Site settings
title: Telecom Security Documents
description: A comprehensive collection of research papers, technical documents, and security analysis related to telecommunications infrastructure, mobile networks, and network security vulnerabilities.
author: RFS
email: 
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com
github_username: your-username

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "default"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/

# Include files
include:
  - _pages
  - _posts
  - _drafts

# Pagination
paginate: 10
paginate_path: "/page/:num/"

# Social media
social:
  name: RFS
  links:
    - https://github.com/your-username
    - https://twitter.com/your-username
    - https://linkedin.com/in/your-username

# Analytics (optional)
google_analytics: # UA-XXXXXXXX-X
google_analytics_anonymize_ip: true

# Comments (optional)
disqus:
  shortname: # your-disqus-shortname

# Search
search: true

# Theme settings
theme_settings:
  # Meta
  meta:
    keywords: "telecom, security, 4G, 5G, SS7, mobile networks, cybersecurity, research"
    description: "Comprehensive telecom security research documents and analysis"
  
  # Header
  header:
    overlay_image: # path to image
    overlay_filter: "rgba(0, 0, 0, 0.5)"
    cta_label: "Browse Documents"
    cta_url: "#documents"
  
  # Footer
  footer:
    links:
      - title: "Documents"
        links:
          - label: "4G Security"
            url: "#4g"
          - label: "5G Security"
            url: "#5g"
          - label: "SS7 Protocol"
            url: "#ss7"
      - title: "Resources"
        links:
          - label: "Videos"
            url: "#videos"
          - label: "About"
            url: "#about"
          - label: "GitHub"
            url: "https://github.com/your-username/Telecom-Security-Documents"

# SEO
seo:
  title: "Telecom Security Documents - RFS"
  description: "Comprehensive collection of telecom security research papers, technical documents, and analysis covering 4G, 5G, SS7, and mobile network vulnerabilities."
  author: "RFS"
  image: # path to default image
  type: "website"
  twitter:
    card: "summary_large_image"
    creator: "@your-username"
    site: "@your-username"

# Sitemap
sitemap:
  changefreq: weekly
  priority: 0.8
  lastmod: 2024-01-01

# Feed
feed:
  path: atom.xml
  limit: 10

# Archives
archives:
  layout: "archive"
  permalink: /:year/:month/:day/:title/

# Categories
categories:
  layout: "category"
  permalink: /category/:name/

# Tags
tags:
  layout: "tag"
  permalink: /tag/:name/

# Related posts
related_posts:
  enabled: true
  threshold: 3
  max_related: 5

# Reading time
reading_time:
  enabled: true
  words_per_minute: 200

# Comments
comments:
  provider: "disqus"
  disqus:
    shortname: # your-disqus-shortname

# Search
search_full_content: true
search_include_headings: true

# MathJax
mathjax:
  enabled: true
  src: "https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.1/MathJax.js?config=TeX-AMS-MML_HTMLorMML"

# Syntax highlighting
syntax_highlighter: rouge
syntax_highlighter_opts:
  block:
    line_numbers: false
    start_line: 1

# Markdown processing
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1,2,3
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Liquid processing
liquid:
  error_mode: warn
  strict_filters: true
  strict_variables: true

# Sass processing
sass:
  load_paths:
    - _sass
    - node_modules
  style: compressed

# Assets
assets:
  compress:
    css: true
    js: true
    html: true
  cachebust: hard
  gzip: true
  prefix: "/assets"

# Minification
html_minifier:
  enabled: true
  remove_comments: true
  remove_whitespace: true
  remove_empty_lines: true
  remove_blank_lines: true
  remove_optional_tags: true
  remove_redundant_attributes: true
  remove_unused_css: true
  remove_unused_js: true
  remove_http_protocol: false
