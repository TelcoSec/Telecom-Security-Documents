name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        npm install -g http-server
        
    - name: Build and test
      run: |
        # Validate HTML
        echo "Validating HTML files..."
        if command -v tidy &> /dev/null; then
          tidy -q -e index.html
        fi
        
        # Check if all required files exist
        echo "Checking required files..."
        test -f index.html
        test -f styles.css
        test -f script.js
        test -f _config.yml
        
        echo "✅ All required files are present"
        echo "✅ HTML validation completed"
        echo "✅ Site is ready for deployment"
        
    - name: Deploy Status
      run: |
        echo "🚀 Deployment completed successfully!"
        echo "📱 Your site will be available at: https://telcosec.github.io/Telecom-Security-Documents"
        echo "⏱️  Please wait a few minutes for GitHub Pages to update"
        
    - name: Comment on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '✅ Site validation completed successfully! The site will be deployed automatically by GitHub Pages.'
          })
